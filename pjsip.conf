[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; LiveKit SIP Trunk Configuration
[livekit-trunk]
type=endpoint
context=livekit-inbound
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
allow=opus
aors=livekit-trunk
direct_media=no
trust_id_inbound=yes
from_domain=livekit-sip

[livekit-trunk]
type=aor
contact=sip:livekit-sip:5061

[livekit-trunk]
type=identify
endpoint=livekit-trunk
match=livekit-sip

; SIP Speaker Endpoints
[1001]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=Breakout35

[1001]
type=aor
max_contacts=1

