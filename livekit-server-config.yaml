port: 7880
bind_addresses:
  - "0.0.0.0"

# RTC Configuration
rtc:
  # UDP ports for WebRTC traffic
  port_range_start: 50000
  port_range_end: 50200
  # Use mDNS for local development
  use_external_ip: false
  # For production, set your external IP
  # external_ip: "your.public.ip"

# Redis for state management
redis:
  address: redis:6379
  
# API Keys - these should match your .env file
keys:
  devkey: secret
  # Add your custom keys here
  # Format: api_key: api_secret

# Room configuration
room:
  # Auto-create rooms when accessed
  auto_create: true
  # Empty rooms get cleaned up after 5 minutes
  empty_timeout: 300
  # Max participants per room (0 = unlimited)
  max_participants: 0
  # Max duration in seconds (0 = unlimited)
  max_duration: 0

# Logging
logging:
  level: info
  # Available levels: debug, info, warn, error
  sample: false

# Enable TURN server for NAT traversal
turn:
  enabled: true
  domain: localhost
  # TURN server will use port 7882
  tls_port: 7882
  udp_port: 7882
  # External TURN can be added here if needed
  # external_tls: true

# Webhooks (optional)
# webhook:
#   urls:
#     - http://your-webhook-handler/livekit
#   api_key: your-webhook-key

# Node configuration (for clustering)
# node_ip: ""

# Limits
limit:
  # Bytes per second for each connection
  bytes_per_sec: 0
  # Number of packets per second
  packets_per_sec: 0
