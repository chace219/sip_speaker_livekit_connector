[default]
; Direct calling between SIP speakers
exten => 1001,1,Dial(PJSIP/1001)
exten => 1002,1,Dial(PJSIP/1002)

; Route to LiveKit rooms - dial pattern: 9XXX where XXX is the room name hash
; Example: dial 9001 to join LiveKit room "meeting-room-1"
exten => _9XXX,1,NoOp(Routing to LiveKit room)
    same => n,Set(ROOM_NAME=${EXTEN:1})  ; Extract room identifier
    same => n,Dial(PJSIP/livekit-trunk/sip:${ROOM_NAME}@livekit-sip:5060)
    same => n,Hangup()

; Route all 4-digit patterns starting with 8 to LiveKit
exten => _8XXX,1,NoOp(Routing to LiveKit conference)
    same => n,Set(ROOM_NAME=room-${EXTEN})
    same => n,Dial(PJSIP/livekit-trunk/sip:${ROOM_NAME}@livekit-sip:5060)
    same => n,Hangup()

[livekit-inbound]
; Handle incoming calls from LiveKit (if needed)
exten => _X.,1,NoOp(Incoming call from LiveKit to ${EXTEN})
    same => n,Dial(PJSIP/${EXTEN})
    same => n,Hangup()