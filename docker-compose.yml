services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk
    restart: always
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10499:10000-10499/udp"
    volumes:
      - ./asterisk/config:/etc/asterisk
      - ./asterisk/logs:/var/log/asterisk
      - ./asterisk/data:/var/lib/asterisk