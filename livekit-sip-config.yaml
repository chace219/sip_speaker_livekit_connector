logging:
  level: debug

redis:
  address: redis:6379

sip:
  port: 5060
  ip: "0.0.0.0"
  flood_threshold: 20

# RTP port range for media
rtp:
  port_range_start: 10500
  port_range_end: 10999

# LiveKit connection settings
# These will be passed via environment variables
# livekit_url: wss://your-livekit-server.com
# api_key: your-api-key
# api_secret: your-api-secret

# SIP trunk configuration for Asterisk
trunks:
  - name: "asterisk-trunk"
    # Whitelist Asterisk IP to prevent flood rejection
    inbound_addresses: 
      - "172.18.0.3"
      - "asterisk"
    # Accept all calls from Asterisk without auth
    inbound_username: ""
    inbound_password: ""
    outbound_address: "asterisk:5062"
    outbound_number: "+15551234567"
    
# Room configuration
rooms:
  # Auto-create rooms based on called number
  auto_create: true
  # Room name pattern - maps SIP extension to LiveKit room
  # Example: calling 001@livekit-sip creates/joins room "room-001"
  name_pattern: "room-{number}"

# Audio settings
audio:
  # Supported codecs (in preference order)
  codecs:
    - opus
    - pcmu  # ulaw
    - pcma  # alaw
  # Sample rate
  sample_rate: 48000
  # Channels
  channels: 1

# DTMF settings
dtmf:
  enabled: true
  type: "rfc2833"  # or "inband" or "info"
